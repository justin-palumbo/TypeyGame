<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typey Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #bde0fe;
      --ground: #95d5b2;
      --crater: transparent;
      --scene-fade: 1s;
      --rocket: #ff595e;
      --empty: #ffffff;
      --outline: #1b1b1b;
      --font: "Arial Rounded MT Bold", sans-serif;
      --rocket-w: min(13vw, 22vh);
      --ground-h: 8vh;
      --word-max: 30vh; /* keeps the word clear of the rocket below it */
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: var(--sky);
      transition: background-color var(--scene-fade);
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }

    body.no-rocket {
      --word-max: 40vh;
    }

    /* The word lives in the top half; the rocket stands in the bottom-right corner. */
    #word-area {
      position: fixed;
      inset: 0 0 45vh 0;
      display: grid;
      place-items: center;
    }

    .no-rocket #word-area {
      bottom: 0;
    }

    .no-rocket #ground,
    .no-rocket #launch {
      display: none;
    }

    #word {
      display: flex;
      gap: 0.04em;
      white-space: nowrap;
      /* Shrink the letters so long words (and a picture) still fit across the screen. */
      font-size: min(calc(92vw / (var(--letters, 8) * 0.78 + var(--picture-w, 0))), var(--word-max));
      font-weight: 600;
      line-height: 1.2;
    }

    #word.has-picture {
      --picture-w: 1.1; /* the picture's width plus its margin, in em */
    }

    .picture {
      align-self: center;
      width: 0.8em;
      height: 0.8em;
      margin-right: 0.26em;
      object-fit: contain;
    }

    .letter {
      display: inline-block;
      color: var(--empty);
      /* Stroke is painted under the fill, so only the outer half shows. */
      -webkit-text-stroke: 0.09em var(--outline);
      paint-order: stroke fill;
      transition: color 0.15s;
    }

    .letter.next {
      animation: bounce 0.9s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.12em); }
    }

    /* Scenes: the sky, stars, ground and craters all fade from one scene to the next. */
    #stars {
      position: fixed;
      inset: 0;
      opacity: 0;
      transition: opacity var(--scene-fade);
    }

    .starry #stars {
      opacity: 1;
    }

    .star {
      position: absolute;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffffff;
      animation: twinkle ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      to { opacity: 0.3; }
    }

    /* Something far off in the sky, low on the left where neither the word nor the rocket is. */
    .backdrop {
      position: fixed;
      left: 8vw;
      bottom: calc(var(--ground-h) + 8vh);
      height: 16vh;
      aspect-ratio: 1;
      opacity: 0;
      transition: opacity var(--scene-fade);
    }

    .backdrop[data-name="saturn"] {
      height: 14vh;
      aspect-ratio: 176 / 80;
    }

    .backdrop.shown {
      opacity: 1;
    }

    .cloud {
      position: fixed;
      aspect-ratio: 140 / 82;
      opacity: 0;
      transition: opacity var(--scene-fade);
      animation: drift ease-in-out infinite alternate;
    }

    .cloudy .cloud {
      opacity: 1;
    }

    @keyframes drift {
      to { translate: 4vw 0; }
    }

    #ground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      height: var(--ground-h);
      overflow: hidden;
      background: var(--ground);
      border-top: 6px solid var(--outline);
      transition: background-color var(--scene-fade);
    }

    .crater {
      position: absolute;
      aspect-ratio: 3;
      border-radius: 50%;
      background: var(--crater);
      box-shadow: inset 0 0.5vw 0 rgba(0, 0, 0, 0.2); /* a shadowed rim makes it look dug in */
      opacity: 0;
      transition: opacity var(--scene-fade), background-color var(--scene-fade);
    }

    .cratered .crater {
      opacity: 1;
    }

    #launch {
      position: fixed;
      right: 6vw;
      bottom: var(--ground-h);
      width: var(--rocket-w);
    }

    /* One craft at a time, picked by the scene. typeygame.js sizes each one to match the rocket. */
    .ship {
      display: none;
      overflow: visible; /* flames and beams hang outside the craft */
    }

    .ship.shown {
      display: block;
    }

    #pad {
      height: calc(var(--rocket-w) * 0.1);
      margin: 0 -12%;
      background: #adb5bd;
      border: 6px solid var(--outline);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    .outline {
      stroke: var(--outline);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .trim {
      fill: var(--rocket);
    }

    .flame {
      transform-box: fill-box;
      transform-origin: 50% 0;
      transform: scale(0);
    }

    .flame.up {
      transform-origin: 50% 100%; /* the balloon's burner shoots upward */
    }

    #craft.lit .flame {
      transform: none;
      animation: flicker 0.12s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: scale(1, 1); }
      to { transform: scale(0.85, 1.15); }
    }

    /* Propellers and rotors, seen from the side, spin by squashing back and forth. */
    .blade-x,
    .blade-y {
      transform-box: fill-box;
      transform-origin: center;
    }

    #craft.lit .blade-x {
      animation: squash-x 0.1s linear infinite alternate;
    }

    #craft.lit .blade-y {
      animation: squash-y 0.08s linear infinite alternate;
    }

    @keyframes squash-x {
      to { transform: scaleX(0.1); }
    }

    @keyframes squash-y {
      to { transform: scaleY(0.1); }
    }

    .beam {
      fill: #fff3b0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #craft.lit .beam {
      opacity: 0.6;
    }

    .ufo-light {
      animation: twinkle 0.8s ease-in-out infinite alternate;
    }

    .blimp-name {
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      fill: #ffca3a;
      stroke: var(--outline);
      stroke-width: 3;
      stroke-linejoin: round;
      paint-order: stroke fill; /* outline behind the letters, like the word's */
    }

    /* Each slice of fuel grows up from the bottom of its spot in the tank. */
    .fuel {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scaleY(0);
      transition: transform 0.4s ease-out;
    }

    .fuel.full {
      transform: scaleY(1);
    }

    .puff {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 50%;
      margin-left: -25%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f8f9fa;
      opacity: 0;
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #fullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.5);
      color: #1b1b1b;
      cursor: pointer;
      opacity: 0.5;
    }

    #fullscreen:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <!-- Far-off things in the sky; each scene's `backdrop` in config.js picks one. -->
  <svg class="backdrop" data-name="moon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="outline" cx="50" cy="50" r="44" fill="#f8f9fa" />
    <circle cx="34" cy="36" r="9" fill="#dee2e6" />
    <circle cx="64" cy="30" r="6" fill="#dee2e6" />
    <circle cx="60" cy="62" r="12" fill="#dee2e6" />
    <circle cx="30" cy="64" r="5" fill="#dee2e6" />
  </svg>

  <svg class="backdrop" data-name="earth" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <clipPath id="earth-clip"><circle cx="50" cy="50" r="44" /></clipPath>
    </defs>
    <g clip-path="url(#earth-clip)">
      <rect width="100" height="100" fill="#4dabf7" />
      <path fill="#69db7c" d="M16 32 C24 18 42 20 44 32 C46 42 36 46 38 56 C40 66 28 72 22 62 C16 52 10 42 16 32 Z" />
      <path fill="#69db7c" d="M58 12 C72 10 86 22 82 36 C80 44 70 40 66 50 C62 56 54 50 54 42 C54 32 48 16 58 12 Z" />
      <path fill="#69db7c" d="M58 72 C66 64 80 66 82 76 C84 86 70 94 60 90 C52 86 52 78 58 72 Z" />
      <path d="M18 76 H38 M62 56 H80" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    </g>
    <circle class="outline" cx="50" cy="50" r="44" fill="none" />
  </svg>

  <svg class="backdrop" data-name="saturn" viewBox="12 20 176 80" aria-hidden="true">
    <defs>
      <path id="rings" fill-rule="evenodd" d="M14 60 A86 24 0 0 0 186 60 A86 24 0 0 0 14 60 Z M42 60 A58 12 0 0 0 158 60 A58 12 0 0 0 42 60 Z" />
      <clipPath id="saturn-clip"><circle cx="100" cy="60" r="34" /></clipPath>
      <clipPath id="rings-behind"><rect width="200" height="60" /></clipPath>
      <clipPath id="rings-in-front"><rect y="60" width="200" height="60" /></clipPath>
    </defs>
    <!-- The rings' top half passes behind the planet and the bottom half in front. -->
    <g transform="rotate(-18 100 60)">
      <use class="outline" href="#rings" fill="#d4a373" clip-path="url(#rings-behind)" />
      <g clip-path="url(#saturn-clip)">
        <rect width="200" height="120" fill="#f4d58d" />
        <rect y="44" width="200" height="7" fill="#e9b872" />
        <rect y="64" width="200" height="9" fill="#e9b872" />
      </g>
      <circle class="outline" cx="100" cy="60" r="34" fill="none" />
      <use class="outline" href="#rings" fill="#d4a373" clip-path="url(#rings-in-front)" />
    </g>
  </svg>

  <!-- Clouds for scenes with `clouds`. Each is its puffs drawn twice: a thick outline,
       then plain white on top to hide where the puffs overlap. -->
  <svg class="cloud" viewBox="10 0 140 82" aria-hidden="true"
       style="top: 5vh; left: 3vw; height: 11vh; animation-duration: 9s">
    <defs>
      <g id="cloud-puffs" fill="#ffffff">
        <circle cx="40" cy="52" r="22" />
        <circle cx="70" cy="36" r="28" />
        <circle cx="104" cy="40" r="24" />
        <circle cx="126" cy="54" r="18" />
        <rect x="30" y="48" width="100" height="26" rx="13" />
      </g>
    </defs>
    <use class="outline" href="#cloud-puffs" style="stroke-width: 10" />
    <use href="#cloud-puffs" />
  </svg>
  <svg class="cloud" viewBox="10 0 140 82" aria-hidden="true"
       style="left: 42vw; bottom: calc(var(--ground-h) + 18vh); height: 9vh; scale: -1 1; animation-duration: 12s; animation-delay: -4s">
    <use class="outline" href="#cloud-puffs" style="stroke-width: 10" />
    <use href="#cloud-puffs" />
  </svg>

  <div id="word-area">
    <div id="word" role="img"></div>
  </div>

  <!-- Craters stay clear of the right side, where the launch pad sits. -->
  <div id="ground">
    <div class="crater" style="left: 3%; top: 25%; width: 8vw"></div>
    <div class="crater" style="left: 16%; top: 55%; width: 4vw"></div>
    <div class="crater" style="left: 26%; top: 35%; width: 10vw"></div>
    <div class="crater" style="left: 43%; top: 20%; width: 5vw"></div>
    <div class="crater" style="left: 54%; top: 50%; width: 7vw"></div>
    <div class="crater" style="left: 67%; top: 25%; width: 4vw"></div>
  </div>
  <div id="launch">
    <div id="craft">
      <svg class="ship" data-name="rocket" viewBox="0 0 120 219" aria-hidden="true">
        <defs>
          <path id="body-shape" d="M60 6 C80 24 92 62 92 104 L90 190 Q90 202 78 202 L42 202 Q30 202 30 190 L28 104 C28 62 40 24 60 6 Z" />
          <rect id="tank" data-tank x="44" y="102" width="32" height="76" rx="10" />
          <clipPath id="body-clip"><use href="#body-shape" /></clipPath>
          <clipPath id="tank-clip"><use href="#tank" /></clipPath>
        </defs>

        <g class="flame">
          <path class="outline" fill="#ff8c42" d="M42 212 C40 240 54 256 60 284 C66 256 80 240 78 212 Z" />
          <path fill="#ffd23f" d="M50 212 C49 232 57 244 60 262 C63 244 71 232 70 212 Z" />
        </g>

        <path class="trim outline" d="M34 130 C14 140 8 170 10 216 L36 196 Z" />
        <path class="trim outline" d="M86 130 C106 140 112 170 110 216 L84 196 Z" />
        <path class="outline" fill="#adb5bd" d="M46 198 L74 198 L80 216 L40 216 Z" />

        <g clip-path="url(#body-clip)">
          <rect width="120" height="219" fill="#ffffff" />
          <rect class="trim" width="120" height="44" />
          <rect class="trim" y="186" width="120" height="20" />
          <path class="outline" d="M0 44 H120 M0 186 H120" />
        </g>
        <use class="outline" href="#body-shape" fill="none" />

        <circle class="outline" cx="60" cy="70" r="15" fill="#a0e7ff" />
        <circle cx="55" cy="65" r="4" fill="#ffffff" />

        <use href="#tank" fill="#e9e4f7" />
        <g data-fuel clip-path="url(#tank-clip)"></g>
        <rect x="49" y="110" width="5" height="44" rx="2.5" fill="#ffffff" opacity="0.6" />
        <use class="outline" href="#tank" fill="none" />
      </svg>

        <defs>
          <path id="dome" d="M50 50 C50 8 110 8 110 50 Z" />
          <clipPath id="dome-clip"><use href="#dome" /></clipPath>
          <!-- The fuel fills this box from the bottom up, clipped to the dome. -->
          <rect data-tank x="50" y="18" width="60" height="32" />
        </defs>

        <path class="beam" d="M62 76 H98 L132 190 H28 Z" />

        <path class="outline" fill="#adb5bd" d="M54 70 L62 74 L48 93 L40 91 Z M106 70 L98 74 L112 93 L120 91 Z" />
        <rect class="outline" x="32" y="90" width="18" height="6" rx="3" fill="#adb5bd" />
        <rect class="outline" x="110" y="90" width="18" height="6" rx="3" fill="#adb5bd" />

        <ellipse class="outline" cx="80" cy="70" rx="34" ry="10" fill="#868e96" />
        <ellipse class="outline" cx="80" cy="58" rx="72" ry="15" fill="#ced4da" />
        <g stroke="#1b1b1b" stroke-width="2.5">
          <circle class="ufo-light" cx="34" cy="58" r="4.5" fill="#ffca3a" />
          <circle class="ufo-light" cx="57" cy="62" r="4.5" fill="#ff595e" style="animation-delay: -0.8s" />
          <circle class="ufo-light" cx="80" cy="63.5" r="4.5" fill="#8ac926" />
          <circle class="ufo-light" cx="103" cy="62" r="4.5" fill="#ff595e" style="animation-delay: -0.8s" />
          <circle class="ufo-light" cx="126" cy="58" r="4.5" fill="#ffca3a" />
        </g>

        <use href="#dome" fill="#e9e4f7" />
        <g data-fuel clip-path="url(#dome-clip)"></g>
        <!-- The alien sits in front of the fuel, so the dome glows up behind him. -->
        <g clip-path="url(#dome-clip)" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round">
          <path fill="none" d="M76 32 L73 26 M84 32 L87 26" />
          <circle cx="73" cy="25.5" r="2.2" fill="#8ac926" />
          <circle cx="87" cy="25.5" r="2.2" fill="#8ac926" />
          <circle cx="80" cy="40" r="10" fill="#8ac926" />
          <ellipse cx="76" cy="39" rx="2.5" ry="3.5" fill="#1b1b1b" stroke="none" />
          <ellipse cx="84" cy="39" rx="2.5" ry="3.5" fill="#1b1b1b" stroke="none" />
          <circle cx="76.8" cy="37.8" r="0.9" fill="#ffffff" stroke="none" />
          <circle cx="84.8" cy="37.8" r="0.9" fill="#ffffff" stroke="none" />
          <path fill="none" stroke-width="2.5" d="M76.5 44.5 Q80 47 83.5 44.5" />
        </g>
        <path d="M58 42 Q59 30 70 25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
        <use class="outline" href="#dome" fill="none" />
      </svg>

      <!-- Planes, helicopters and blimps face left: they land from the right and leave to the left. -->
      <svg class="ship" data-name="airplane" viewBox="0 0 200 100" aria-hidden="true">
        <defs>
          <path id="fuselage" d="M40 34 H160 C176 34 184 42 184 50 C184 58 176 66 160 66 H40 C28 66 20 58 20 50 C20 42 28 34 40 34 Z" />
          <clipPath id="fuselage-clip"><use href="#fuselage" /></clipPath>
          <rect data-tank x="20" y="34" width="164" height="32" />
        </defs>
        <path class="trim outline" d="M148 38 L160 8 H178 V38 Z" />
        <path class="outline" fill="#a0e7ff" d="M50 36 C54 20 80 20 88 36 Z" />
        <path class="outline" fill="none" d="M62 64 V88 M166 64 V92" />
        <circle class="outline" cx="62" cy="90" r="8" fill="#495057" />
        <circle class="outline" cx="166" cy="93" r="5" fill="#495057" />

        <use href="#fuselage" fill="#ffffff" />
        <g data-fuel clip-path="url(#fuselage-clip)"></g>
        <g class="outline" fill="#ffffff" style="stroke-width: 3">
          <circle cx="104" cy="46" r="4.5" />
          <circle cx="120" cy="46" r="4.5" />
          <circle cx="136" cy="46" r="4.5" />
        </g>
        <use class="outline" href="#fuselage" fill="none" />

        <path class="trim outline" d="M156 50 H182 C186 50 186 56 182 56 H156 Z" />
        <path class="trim outline" d="M74 54 H116 L102 82 H88 Z" />
        <circle class="outline" cx="20" cy="50" r="7" fill="#ffca3a" />
        <ellipse class="blade-y outline" cx="11" cy="50" rx="3.5" ry="24" fill="#adb5bd" />

        <path class="trim outline" d="M150 20 L176 4 H188 L178 30 Z M150 60 L176 76 H188 L178 50 Z" />
        <circle class="outline" cx="96" cy="98" r="6" fill="#495057" />

        <g class="outline" fill="#a0e7ff" style="stroke-width: 3">

        <path class="outline" fill="none" style="stroke-width: 3" d="M44 14 C36 30 36 50 44 66" />
        <!-- textLength squeezes or stretches it to fit, whichever font loads -->
        <text class="blimp-name" x="99" y="46" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs">GOOD YEAR</text>
        <use class="outline" href="#blimp-body" fill="none" />

        <path class="outline" fill="none" d="M120 80 H128" />
        <ellipse class="blade-y outline" cx="128" cy="80" rx="2.5" ry="10" fill="#adb5bd" />
      </svg>

      <svg class="ship" data-name="lander" viewBox="0 0 140 137" aria-hidden="true">
        <defs>
          <rect id="descent" data-tank x="24" y="62" width="92" height="36" rx="4" />
          <clipPath id="descent-clip"><use href="#descent" /></clipPath>
        </defs>
        <g class="flame">
          <path class="outline" fill="#ff8c42" d="M56 112 C54 132 64 142 70 158 C76 142 86 132 84 112 Z" />
          <path fill="#ffd23f" d="M62 112 C61 126 67 134 70 144 C73 134 79 126 78 112 Z" />
        </g>
        <path class="outline" fill="#adb5bd" d="M32 70 L38 74 L13 128 L7 126 Z M108 70 L102 74 L127 128 L133 126 Z" />
        <ellipse class="outline" cx="10" cy="130" rx="10" ry="4" fill="#adb5bd" />
        <ellipse class="outline" cx="130" cy="130" rx="10" ry="4" fill="#adb5bd" />
        <path class="outline" fill="#868e96" d="M60 98 H80 L86 112 H54 Z" />

        <path class="outline" fill="none" d="M100 22 L108 8" />
        <circle class="outline" cx="109" cy="7" r="4" fill="#ffffff" style="stroke-width: 3" />
        <path class="outline" fill="#dee2e6" d="M40 22 H100 L112 40 V62 H28 V40 Z" />
        <rect class="outline" x="56" y="32" width="28" height="18" rx="6" fill="#a0e7ff" />

        <!-- The gold descent stage is the fuel tank. -->
        <use href="#descent" fill="#fbe8a6" />
        <g data-fuel clip-path="url(#descent-clip)"></g>
        <use class="outline" href="#descent" fill="none" />
      </svg>
    </div>
    <div id="pad"></div>
  </div>

  <canvas id="confetti"></canvas>
  <button id="fullscreen" title="Full screen" aria-label="Full screen">

      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />

  <script src="config.js"></script>
  <script src="typeygame.js"></script>
</body>
