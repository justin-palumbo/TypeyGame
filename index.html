<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typey Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #bde0fe;
      --empty: #ffffff;
      --outline: #1b1b1b;
      --font: "Arial Rounded MT Bold", sans-serif;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }

    #word {
      display: flex;
      gap: 0.04em;
      white-space: nowrap;
      /* Shrink the letters so long words still fit across the screen. */
      font-size: min(calc(92vw / (var(--letters, 8) * 0.78)), 40vh);
      font-weight: 600;
      line-height: 1.2;
    }

    .letter {
      display: inline-block;
      color: var(--empty);
      /* Stroke is painted under the fill, so only the outer half shows. */
      -webkit-text-stroke: 0.09em var(--outline);
      paint-order: stroke fill;
      transition: color 0.15s;
    }

    .letter.next {
      animation: bounce 0.9s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.12em); }
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #fullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.5);
      color: #1b1b1b;
      cursor: pointer;
      opacity: 0.5;
    }

    #fullscreen:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="word" role="img"></div>
  <canvas id="confetti"></canvas>
  <button id="fullscreen" title="Full screen" aria-label="Full screen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
    </svg>
  </button>

  <script src="config.js"></script>
  <script src="typeygame.js"></script>
</body>
</html>
