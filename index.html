<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typey Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #bde0fe;
      --ground: #95d5b2;
      --crater: transparent;
      --scene-fade: 1s;
      --rocket: #ff595e;
      --empty: #ffffff;
      --outline: #1b1b1b;
      --font: "Arial Rounded MT Bold", sans-serif;
      --rocket-w: min(13vw, 22vh);
      --ground-h: 8vh;
      --word-max: 30vh; /* keeps the word clear of the rocket below it */
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: var(--sky);
      transition: background-color var(--scene-fade);
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }

    body.no-rocket {
      --word-max: 40vh;
    }

    /* The word lives in the top half; the rocket stands in the bottom-right corner. */
    #word-area {
      position: fixed;
      inset: 0 0 45vh 0;
      display: grid;
      place-items: center;
    }

    .no-rocket #word-area {
      bottom: 0;
    }

    .no-rocket #ground,
    .no-rocket #launch {
      display: none;
    }

    #word {
      display: flex;
      gap: 0.04em;
      white-space: nowrap;
      /* Shrink the letters so long words (and a picture) still fit across the screen. */
      font-size: min(calc(92vw / (var(--letters, 8) * 0.78 + var(--picture-w, 0))), var(--word-max));
      font-weight: 600;
      line-height: 1.2;
    }

    #word.has-picture {
      --picture-w: 1.1; /* the picture's width plus its margin, in em */
    }

    .picture {
      align-self: center;
      width: 0.8em;
      height: 0.8em;
      margin-right: 0.26em;
      object-fit: contain;
    }

    .letter {
      display: inline-block;
      color: var(--empty);
      /* Stroke is painted under the fill, so only the outer half shows. */
      -webkit-text-stroke: 0.09em var(--outline);
      paint-order: stroke fill;
      transition: color 0.15s;
    }

    .letter.next {
      animation: bounce 0.9s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.12em); }
    }

    /* Scenes: the sky, stars, ground and craters all fade from one scene to the next. */
    #stars {
      position: fixed;
      inset: 0;
      opacity: 0;
      transition: opacity var(--scene-fade);
    }

    .starry #stars {
      opacity: 1;
    }

    .star {
      position: absolute;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffffff;
      animation: twinkle ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      to { opacity: 0.3; }
    }

    /* Something far off in the sky, low on the left where neither the word nor the rocket is. */
    .backdrop {
      position: fixed;
      left: 8vw;
      bottom: calc(var(--ground-h) + 8vh);
      height: 16vh;
      aspect-ratio: 1;
      opacity: 0;
      transition: opacity var(--scene-fade);
    }

    .backdrop[data-name="saturn"] {
      height: 14vh;
      aspect-ratio: 176 / 80;
    }

    .backdrop.shown {
      opacity: 1;
    }

    .cloud {
      position: fixed;
      aspect-ratio: 140 / 82;
      opacity: 0;
      transition: opacity var(--scene-fade);
      animation: drift ease-in-out infinite alternate;
    }

    .cloudy .cloud {
      opacity: 1;
    }

    @keyframes drift {
      to { translate: 4vw 0; }
    }

    #ground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      box-sizing: border-box;
      height: var(--ground-h);
      overflow: hidden;
      background: var(--ground);
      border-top: 6px solid var(--outline);
      transition: background-color var(--scene-fade);
    }

    .crater {
      position: absolute;
      aspect-ratio: 3;
      border-radius: 50%;
      background: var(--crater);
      box-shadow: inset 0 0.5vw 0 rgba(0, 0, 0, 0.2); /* a shadowed rim makes it look dug in */
      opacity: 0;
      transition: opacity var(--scene-fade), background-color var(--scene-fade);
    }

    .cratered .crater {
      opacity: 1;
    }

    #launch {
      position: fixed;
      right: 6vw;
      bottom: var(--ground-h);
      width: var(--rocket-w);
    }

    #rocket svg {
      display: block;
      width: 100%;
      aspect-ratio: 120 / 219;
      overflow: visible; /* the flame hangs below the rocket */
    }

    #pad {
      height: calc(var(--rocket-w) * 0.1);
      margin: 0 -12%;
      background: #adb5bd;
      border: 6px solid var(--outline);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    .outline {
      stroke: var(--outline);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .trim {
      fill: var(--rocket);
    }

    .flame {
      transform-box: fill-box;
      transform-origin: 50% 0;
      transform: scale(0);
    }

    #rocket.lit .flame {
      transform: none;
      animation: flicker 0.12s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: scale(1, 1); }
      to { transform: scale(0.85, 1.15); }
    }

    /* Each slice of fuel grows up from the bottom of its spot in the tank. */
    .fuel {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scaleY(0);
      transition: transform 0.4s ease-out;
    }

    .fuel.full {
      transform: scaleY(1);
    }

    .puff {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 50%;
      margin-left: -25%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f8f9fa;
      opacity: 0;
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #fullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.5);
      color: #1b1b1b;
      cursor: pointer;
      opacity: 0.5;
    }

    #fullscreen:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <!-- Far-off things in the sky; each scene's `backdrop` in config.js picks one. -->
  <svg class="backdrop" data-name="moon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="outline" cx="50" cy="50" r="44" fill="#f8f9fa" />
    <circle cx="34" cy="36" r="9" fill="#dee2e6" />
    <circle cx="64" cy="30" r="6" fill="#dee2e6" />
    <circle cx="60" cy="62" r="12" fill="#dee2e6" />
    <circle cx="30" cy="64" r="5" fill="#dee2e6" />
  </svg>

  <svg class="backdrop" data-name="earth" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <clipPath id="earth-clip"><circle cx="50" cy="50" r="44" /></clipPath>
    </defs>
    <g clip-path="url(#earth-clip)">
      <rect width="100" height="100" fill="#4dabf7" />
      <path fill="#69db7c" d="M16 32 C24 18 42 20 44 32 C46 42 36 46 38 56 C40 66 28 72 22 62 C16 52 10 42 16 32 Z" />
      <path fill="#69db7c" d="M58 12 C72 10 86 22 82 36 C80 44 70 40 66 50 C62 56 54 50 54 42 C54 32 48 16 58 12 Z" />
      <path fill="#69db7c" d="M58 72 C66 64 80 66 82 76 C84 86 70 94 60 90 C52 86 52 78 58 72 Z" />
      <path d="M18 76 H38 M62 56 H80" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    </g>
    <circle class="outline" cx="50" cy="50" r="44" fill="none" />
  </svg>

  <svg class="backdrop" data-name="saturn" viewBox="12 20 176 80" aria-hidden="true">
    <defs>
      <path id="rings" fill-rule="evenodd" d="M14 60 A86 24 0 0 0 186 60 A86 24 0 0 0 14 60 Z M42 60 A58 12 0 0 0 158 60 A58 12 0 0 0 42 60 Z" />
      <clipPath id="saturn-clip"><circle cx="100" cy="60" r="34" /></clipPath>
      <clipPath id="rings-behind"><rect width="200" height="60" /></clipPath>
      <clipPath id="rings-in-front"><rect y="60" width="200" height="60" /></clipPath>
    </defs>
    <!-- The rings' top half passes behind the planet and the bottom half in front. -->
    <g transform="rotate(-18 100 60)">
      <use class="outline" href="#rings" fill="#d4a373" clip-path="url(#rings-behind)" />
      <g clip-path="url(#saturn-clip)">
        <rect width="200" height="120" fill="#f4d58d" />
        <rect y="44" width="200" height="7" fill="#e9b872" />
        <rect y="64" width="200" height="9" fill="#e9b872" />
      </g>
      <circle class="outline" cx="100" cy="60" r="34" fill="none" />
      <use class="outline" href="#rings" fill="#d4a373" clip-path="url(#rings-in-front)" />
    </g>
  </svg>

  <!-- Clouds for scenes with `clouds`. Each is its puffs drawn twice: a thick outline,
       then plain white on top to hide where the puffs overlap. -->
  <svg class="cloud" viewBox="10 0 140 82" aria-hidden="true"
       style="top: 5vh; left: 3vw; height: 11vh; animation-duration: 9s">
    <defs>
      <g id="cloud-puffs" fill="#ffffff">
        <circle cx="40" cy="52" r="22" />
        <circle cx="70" cy="36" r="28" />
        <circle cx="104" cy="40" r="24" />
        <circle cx="126" cy="54" r="18" />
        <rect x="30" y="48" width="100" height="26" rx="13" />
      </g>
    </defs>
    <use class="outline" href="#cloud-puffs" style="stroke-width: 10" />
    <use href="#cloud-puffs" />
  </svg>
  <svg class="cloud" viewBox="10 0 140 82" aria-hidden="true"
       style="left: 42vw; bottom: calc(var(--ground-h) + 18vh); height: 9vh; scale: -1 1; animation-duration: 12s; animation-delay: -4s">
    <use class="outline" href="#cloud-puffs" style="stroke-width: 10" />
    <use href="#cloud-puffs" />
  </svg>

  <div id="word-area">
    <div id="word" role="img"></div>
  </div>

  <!-- Craters stay clear of the right side, where the launch pad sits. -->
  <div id="ground">
    <div class="crater" style="left: 3%; top: 25%; width: 8vw"></div>
    <div class="crater" style="left: 16%; top: 55%; width: 4vw"></div>
    <div class="crater" style="left: 26%; top: 35%; width: 10vw"></div>
    <div class="crater" style="left: 43%; top: 20%; width: 5vw"></div>
    <div class="crater" style="left: 54%; top: 50%; width: 7vw"></div>
    <div class="crater" style="left: 67%; top: 25%; width: 4vw"></div>
  </div>
  <div id="launch">
    <div id="rocket">
      <svg viewBox="0 0 120 219" aria-hidden="true">
        <defs>
          <path id="body-shape" d="M60 6 C80 24 92 62 92 104 L90 190 Q90 202 78 202 L42 202 Q30 202 30 190 L28 104 C28 62 40 24 60 6 Z" />
          <rect id="tank" x="44" y="102" width="32" height="76" rx="10" />
          <clipPath id="body-clip"><use href="#body-shape" /></clipPath>
          <clipPath id="tank-clip"><use href="#tank" /></clipPath>
        </defs>

        <g class="flame">
          <path class="outline" fill="#ff8c42" d="M42 212 C40 240 54 256 60 284 C66 256 80 240 78 212 Z" />
          <path fill="#ffd23f" d="M50 212 C49 232 57 244 60 262 C63 244 71 232 70 212 Z" />
        </g>

        <path class="trim outline" d="M34 130 C14 140 8 170 10 216 L36 196 Z" />
        <path class="trim outline" d="M86 130 C106 140 112 170 110 216 L84 196 Z" />
        <path class="outline" fill="#adb5bd" d="M46 198 L74 198 L80 216 L40 216 Z" />

        <g clip-path="url(#body-clip)">
          <rect width="120" height="219" fill="#ffffff" />
          <rect class="trim" width="120" height="44" />
          <rect class="trim" y="186" width="120" height="20" />
          <path class="outline" d="M0 44 H120 M0 186 H120" />
        </g>
        <use class="outline" href="#body-shape" fill="none" />

        <circle class="outline" cx="60" cy="70" r="15" fill="#a0e7ff" />
        <circle cx="55" cy="65" r="4" fill="#ffffff" />

        <use href="#tank" fill="#e9e4f7" />
        <g id="fuel" clip-path="url(#tank-clip)"></g>
        <rect x="49" y="110" width="5" height="44" rx="2.5" fill="#ffffff" opacity="0.6" />
        <use class="outline" href="#tank" fill="none" />
      </svg>
    </div>
    <div id="pad"></div>
  </div>

  <canvas id="confetti"></canvas>
  <button id="fullscreen" title="Full screen" aria-label="Full screen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
    </svg>
  </button>

  <script src="config.js"></script>
  <script src="typeygame.js"></script>
</body>
</html>
