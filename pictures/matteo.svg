<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <path id="mouth" d="M38 63 Q50 66 62 63 Q60 75 50 75 Q40 75 38 63 Z" />
    <clipPath id="mouth-clip"><use href="#mouth" /></clipPath>
  </defs>
  <g stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- space explorer t-shirt -->
    <path fill="#d9dadc" d="M8 102 C10 88 22 82 36 80 H64 C78 82 90 88 92 102 Z" />
    <circle cx="50" cy="93" r="3.5" fill="#4aa3df" stroke-width="2" />
    <ellipse cx="50" cy="93" rx="8" ry="2.2" fill="none" stroke="#2f8fd8" stroke-width="2" transform="rotate(-15 50 93)" />

    <path fill="#f8d9c4" d="M41 70 V81 Q50 87 59 81 V70 Z" />
    <circle cx="24" cy="59" r="6" fill="#f8d9c4" />
    <circle cx="76" cy="59" r="6" fill="#f8d9c4" />
    <ellipse cx="50" cy="51" rx="27" ry="28" fill="#f8d9c4" />

    <!-- shaggy dark hair with a long fringe down to the eyes -->
    <path fill="#3b2a20" d="M21 58 C14 30 28 11 51 12 C74 12 88 30 80 58 C76 54 73 47 74 40 Q72 46 69 46 Q66 44 64 39 Q62 45 59 45 Q56 44 54 38 Q52 45 49 45 Q46 44 44 38 Q42 44 39 44 Q36 43 34 38 Q32 43 30 43 Q28 42 27 40 C27 47 24 54 21 58 Z" />
    <path fill="none" stroke="#6b4a36" stroke-width="2.5" d="M46 17 C54 22 62 30 66 38 M36 20 C40 26 42 31 42 36 M61 18 C66 21 72 28 74 34" />

    <circle cx="32" cy="60" r="5" fill="#ff9aa2" opacity="0.5" stroke="none" />
    <circle cx="68" cy="60" r="5" fill="#ff9aa2" opacity="0.5" stroke="none" />
    <!-- squinty laughing eyes and a little nose -->
    <path fill="none" stroke-width="3.5" d="M34 53 Q39 47.5 44 53 M56 53 Q61 47.5 66 53" />
    <path fill="none" stroke-width="2.5" d="M48 57.5 Q50 60 52 57.5" />

    <!-- big open smile: top teeth and tongue inside, outline on top -->
    <use href="#mouth" fill="#8c2f39" stroke="none" />
    <g clip-path="url(#mouth-clip)" stroke="none">
      <path fill="#ffffff" d="M36 61 H64 V67 Q50 71 36 67 Z" />
      <ellipse cx="50" cy="75" rx="8" ry="5" fill="#ff8fab" />
    </g>
    <use href="#mouth" fill="none" stroke-width="3.5" />
  </g>
</svg>
